<script>
const K='qlch_v1';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=ymd(new Date());let mon=today.slice(0,7),day=today,tab='home';
const f=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
function seed(){
  return{store:{name:'Cửa hàng của tôi',type:'',size:'',rent:0,util:0,other:0},products:[],sales:[],staff:[],att:{}};
}
function loadDB(){try{const r=localStorage.getItem(K);if(r){const d=JSON.parse(r);return d.stores?d:{cur:'a',stores:{a:d}}}}catch(e){}return{cur:'a',stores:{a:seed()}}}
function snaps(){try{return JSON.parse(localStorage.getItem(K+'_s'))||[]}catch(e){return[]}}
function save(){DB.stores[DB.cur]=S;DB.t=Date.now();try{const j=JSON.stringify(DB);localStorage.setItem(K,j);const sn=snaps();if(!sn.length||Date.now()-sn[0].t>300000){sn.unshift({t:Date.now(),db:JSON.parse(j)});localStorage.setItem(K+'_s',JSON.stringify(sn.slice(0,6)))}}catch(e){}sync();const e=document.getElementById('sv');if(e)e.textContent='✓ Đã tự động lưu '+new Date().toLocaleTimeString('vi-VN')}
let DB=loadDB(),S=DB.stores[DB.cur];
function sw(id){DB.cur=id;S=DB.stores[id];save();render()}
function addStore(){const n=prompt('Tên cửa hàng mới?');if(!n)return;const id=uid();DB.stores[id]={store:{name:n,type:'',size:'',rent:0,util:0,other:0,goal:0},products:[],sales:[],staff:[],att:{}};sw(id);tab='set';render()}
function dupStore(){const id=uid();DB.stores[id]=JSON.parse(JSON.stringify(S));DB.stores[id].store.name+=' (bản sao)';sw(id)}
function delStore(){if(AU.role!='owner')return alert('Chỉ chủ cửa hàng được xoá cửa hàng');if(Object.keys(DB.stores).length<2)return alert('Cần giữ ít nhất 1 cửa hàng');if(!confirm('Xoá cửa hàng "'+S.store.name+'" và toàn bộ dữ liệu?'))return;delete DB.stores[DB.cur];sw(Object.keys(DB.stores)[0])}
function sw0(){return '<div class="card row" style="align-items:center"><label>Cửa hàng<select onchange="sw(this.value)">'+Object.entries(DB.stores).map(([id,d])=>'<option value="'+id+'"'+(id==DB.cur?' selected':'')+'>'+esc(d.store.name)+'</option>').join('')+'</select></label><span class="sub" id="sv">✓ Tự động lưu</span><span class="sub">👤 '+esc(AU.u)+' · '+RN[AU.role]+'</span>'+(AU.role!='staff'?'<button class="s" data-t="noti" onclick="tab=this.dataset.t;render()">'+IC('bell')+(nb()?'<span class="bd">'+nb()+'</span>':'')+'</button>':'')+'<button class="s" onclick="logout()">Đăng xuất</button></div>'}
function adj(id,k,v){S.adj=S.adj||{};const key=mon+'|'+id,x=S.adj[key]||[0,0];x[k]=+v||0;S.adj[key]=x;save();render()}
function goalCard(c){const g=+S.store.goal||0,n=new Date(),dm=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),fc=c.rev/n.getDate()*dm;return '<div class="card" style="margin-top:12px"><span class="sub">Dự báo doanh thu cuối tháng</span> <b>'+f(fc)+'</b>'+(g?'<div class="sub">Mục tiêu '+f(g)+' · hiện đạt '+Math.round(c.rev/g*100)+'%</div><div class="bar"><div style="width:'+Math.min(100,c.rev/g*100)+'%;background:var(--pr)"></div></div>':'<div class="sub">Đặt mục tiêu doanh thu trong Cài đặt để theo dõi tiến độ.</div>')+'</div>'}
function allView(){const bak=S;const T0=[0,0];const rows=Object.entries(DB.stores).map(([id,d])=>{S=d;const c=calc(mon);T0[0]+=c.rev;T0[1]+=c.profit;return '<tr><td>'+(id==DB.cur?'▶ ':'')+esc(d.store.name)+'</td><td>'+f(c.rev)+'</td><td>'+f(c.sal)+'</td><td class="'+(c.profit<0?'neg':'pos')+'">'+f(c.profit)+'</td><td>'+(c.rev?(c.profit/c.rev*100).toFixed(1)+'%':'—')+'</td><td><button class="s" onclick="sw(\''+id+'\');tab=\'home\';render()">Mở</button></td></tr>'}).join('');S=bak;return monthPick()+'<div class="grid">'+kpi('Số cửa hàng',Object.keys(DB.stores).length)+kpi('Tổng doanh thu',f(T0[0]))+kpi('Tổng lợi nhuận',f(T0[1]),T0[1]<0?'neg':'pos')+'</div><div class="card" style="margin-top:12px"><h2>So sánh các cửa hàng</h2><div class="wrap"><table><tr><th>Cửa hàng</th><th>Doanh thu</th><th>Lương</th><th>Lợi nhuận</th><th>Biên</th><th></th></tr>'+rows+'</table></div><div class="row" style="margin-top:10px"><button onclick="addStore()">+ Thêm cửa hàng</button><button class="s" onclick="dupStore()">Nhân bản cửa hàng này</button><button class="s" onclick="delStore()">Xoá cửa hàng này</button><button class="s" data-k="all" onclick="xl(this.dataset.k)">📥 Excel tất cả</button></div></div>'}
function snapUI(){const s=snaps();return '<div class="row" style="margin-bottom:10px"><label class="btnf">📂 '+L('Khôi phục từ file sao lưu (.json)','Restore from backup file (.json)')+'<input type="file" accept=".json" hidden onchange="imp(this.files[0]);this.value=\'\'"></label></div>'+(s.length?'<div class="sub">Bản sao lưu tự động (bấm để khôi phục):</div><div class="row" style="margin:6px 0 10px">'+s.map((x,i)=>'<button class="s" onclick="rest('+i+')">'+new Date(x.t).toLocaleString('vi-VN')+'</button>').join('')+'</div>':'')}
function rest(i){const x=snaps()[i];if(x&&confirm('Khôi phục bản lúc '+new Date(x.t).toLocaleString('vi-VN')+'? Dữ liệu hiện tại sẽ bị thay.')){DB=x.db;if(!DB.stores[DB.cur])DB.cur=Object.keys(DB.stores)[0];S=DB.stores[DB.cur];save();render()}}
function imp(fl){if(!fl)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.stores)DB=d;else if(d.products){const id=uid();DB.stores[id]=d;DB.cur=id}else throw 0;if(!DB.stores[DB.cur])DB.cur=Object.keys(DB.stores)[0];S=DB.stores[DB.cur];save();render();alert('Đã khôi phục dữ liệu')}catch(e){alert('File không hợp lệ')}};r.readAsText(fl)}
async function xl(k){const dl=window.claude?await claude.use('downloads'):null;if(!dl||typeof XLSX==='undefined')return alert('Trình duyệt này chưa hỗ trợ xuất Excel');
const wb=XLSX.utils.book_new(),A=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n.slice(0,31)),st=k=='all'?Object.values(DB.stores):[S],bak=S;
st.forEach((s,j)=>{S=s;const p=st.length>1?'CH'+(j+1)+' ':'',c=calc(mon);
A(p+'Bang luong '+mon,[['Tên','Vị trí','Hình thức','Mức lương','Ngày công','Giờ','Lương CB','Thưởng','Khấu trừ/ứng','Thực lĩnh'],...S.staff.map(t=>{const m=salary(t,mon);return[t.name,t.role,t.type=='hour'?'Theo giờ':'Theo tháng',t.rate,m.dd,m.h,Math.round(m.pay),m.b,m.d,Math.round(m.net)]})]);
if(k=='pay')return;
A(p+'Kho',[['Tên','ĐV','Giá vốn','Giá bán','Đã nhập','Đã dùng','Tồn','Tối thiểu','Giá trị tồn'],...S.products.map(x=>[x.name,x.unit,x.cost,x.price,x.menu?'':x.imported,S.sales.filter(y=>y.pid==x.id).reduce((a,y)=>a+y.q,0),x.menu?'':x.stock,x.menu?'':x.min,x.menu?0:x.stock*x.cost])]);
A(p+'Doanh thu',[['Ngày','Sản phẩm','SL','Đơn giá','Thành tiền','Giá vốn','Lãi gộp'],...S.sales.filter(y=>y.d.startsWith(mon)).map(y=>[y.d,(P(y.pid)||{name:''}).name,y.q,y.p,y.q*y.p,y.q*y.c,y.q*(y.p-y.c)])]);
A(p+'Loi nhuan',[['Khoản mục',S.store.name+' '+mon],['Doanh thu',c.rev],['Giá vốn',c.cogs],['Lợi nhuận gộp',c.gross],['Lương',c.sal],['Thuê mặt bằng',+S.store.rent],['Điện nước',+S.store.util],['Chi phí khác',+S.store.other],['Lợi nhuận ròng',c.profit]])});
S=bak;try{await dl.save({filename:(k=='pay'?'bang-luong-':'bao-cao-')+mon+'.xlsx',data:new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'}))})}catch(e){if(e&&e.code!='declined')alert('Không lưu được file: '+(e.message||e))}}
const P=id=>S.products.find(p=>p.id==id);
function salary(st,m){const a=S.att[st.id]||{};let h=0,dd=0;for(const k in a)if(k.startsWith(m)&&a[k]>0){h+=a[k];dd++}
  const pay=st.type=='hour'?st.rate*h:Math.min(st.rate,st.rate*dd/26),x=(S.adj&&S.adj[m+'|'+st.id])||[0,0];return{h,dd,pay,b:x[0],d:x[1],net:pay+x[0]-x[1]}}
function calc(m){const ss=S.sales.filter(s=>s.d.startsWith(m));const rev=ss.reduce((a,s)=>a+s.q*s.p,0),cogs=ss.reduce((a,s)=>a+s.q*s.c,0);
  const sal=S.staff.reduce((a,t)=>a+salary(t,m).net,0),fixed=+S.store.rent+ +S.store.util+ +S.store.other;
  return{rev,cogs,sal,fixed,gross:rev-cogs,profit:rev-cogs-sal-fixed}}
function rev(a,b){let t=0;S.sales.forEach(s=>{if(s.d>=a&&s.d<=b)t+=s.q*s.p});return t}
function off(n){const d=new Date();d.setDate(d.getDate()-n);return ymd(d)}
function analyze(){const c=calc(today.slice(0,7)),al=[],tips=[];let sc=100;
  const add=(t,m,pen,tip)=>{al.push([t,m]);sc-=pen;if(tip)tips.push(tip)};
  if(c.profit<0)add('d','Cửa hàng đang LỖ '+f(-c.profit)+' trong tháng này.',30,'Tăng giá nhẹ 3–5% món bán chạy hoặc giảm chi phí cố định (thuê, điện nước) để về hoà vốn.');
  const gm=c.rev?c.gross/c.rev:0;
  if(c.rev&&gm<.5)add('w','Biên lợi nhuận gộp chỉ '+Math.round(gm*100)+'% (nên ≥ 55–60% với đồ uống).',12,'Đàm phán lại giá nhập hoặc thay nguyên liệu để nâng biên gộp.');
  if(c.rev&&c.sal/c.rev>.3)add('w','Lương chiếm '+Math.round(c.sal/c.rev*100)+'% doanh thu (ngưỡng khuyến nghị ≤ 30%).',12,'Xếp ca theo giờ cao điểm, dùng part-time thay vì tăng nhân viên cố định.');
  if(c.rev&&c.fixed/c.rev>.25)add('w','Chi phí cố định chiếm '+Math.round(c.fixed/c.rev*100)+'% doanh thu (nên ≤ 25%).',10,'Cần tăng doanh thu (khuyến mãi, bán online) để chia nhỏ chi phí cố định.');
  const w1=rev(off(6),today),w0=rev(off(13),off(7));
  if(w0>0&&w1<w0*.85)add('w','Doanh thu 7 ngày gần nhất giảm '+Math.round((1-w1/w0)*100)+'% so với tuần trước.',12,'Chạy combo / ưu đãi khung giờ vắng và kiểm tra lại món bán chậm.');
  S.products.forEach(p=>{
    if(p.stock<=0)add('d',p.name+': đã HẾT hàng.',8,'Nhập ngay '+p.name+' để không mất doanh thu.');
    else if(p.stock<p.min)add('w',p.name+': tồn '+p.stock+' '+p.unit+' dưới mức tối thiểu ('+p.min+').',4,'Nhập bổ sung '+p.name+' (khoảng '+(p.min*2-p.stock)+' '+p.unit+').');
    const m=p.price?(p.price-p.cost)/p.price:0;
    if(m<.3)add('w',p.name+': biên lãi chỉ '+Math.round(m*100)+'% (giá '+f(p.price)+' / vốn '+f(p.cost)+').',5,'Tăng giá '+p.name+' lên ~'+f(Math.ceil(p.cost/.55/1000)*1000)+' để đạt biên ~45%.');
    const sold=S.sales.filter(s=>s.pid==p.id&&s.d>=off(13)).reduce((a,s)=>a+s.q,0);
    if(sold==0&&p.stock>0)add('w',p.name+(p.menu?': không bán được trong 14 ngày.':': không bán được trong 14 ngày, đang tồn kho.'),4,p.menu?'Đẩy món '+p.name+' bằng khuyến mãi hoặc xem lại thực đơn.':'Xả hàng '+p.name+' bằng khuyến mãi để giải phóng vốn.');
  });
  S.products.forEach(p=>{const q=S.sales.filter(s=>s.pid==p.id&&s.d>=off(13)).reduce((a,s)=>a+s.q,0)/14;if(q>0&&p.stock>0&&p.stock/q<3)tips.push(p.name+' chỉ đủ bán khoảng '+Math.max(1,Math.floor(p.stock/q))+' ngày nữa, nên nhập trước.')});
  const best=[...S.products].map(p=>({p,t:(p.price-p.cost)*S.sales.filter(s=>s.pid==p.id&&s.d.startsWith(mon)).reduce((a,s)=>a+s.q,0)})).sort((a,b)=>b.t-a.t)[0];
  if(best&&best.t>0)tips.push('Món sinh lời nhất tháng: '+best.p.name+' ('+f(best.t)+'). Ưu tiên trưng bày và đảm bảo luôn đủ hàng.');
  if(!al.length)al.push(['g','Cửa hàng đang hoạt động tốt, chưa có cảnh báo.']);

const cloudApi={
  doc(path){
    const key=String(path).split('/').map(encodeURIComponent).join('/');
    return {
      async get(){
        const r=await fetch('/api/doc/'+key,{credentials:'same-origin',cache:'no-store'});
        if(!r.ok)throw new Error('Cloudflare API '+r.status);
        const x=await r.json();
        return {exists:!!x.exists,data:()=>x.data||{}};
      },
      async set(data){
        const r=await fetch('/api/doc/'+key,{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});
        if(!r.ok)throw new Error('Cloudflare API '+r.status);
        cloudOnline=true;cloudStatus('✓ Đã đồng bộ Cloudflare');
        return r.json();
      }
    };
  }
};

function tabCard(){const h=hidMap(),row=(id,lb,on,dis)=>`<label class="sw"><span>${lb}${id=='set'?`<div class="sub">${L('Luôn hiện để không bị khoá khỏi Cài đặt','Always shown so you can’t lock yourself out')}</div>`:''}</span><input type="checkbox" ${on?'checked':''} ${dis?'disabled':''} data-i="${id}" onchange="tvTg(this.dataset.i,this.checked)"></label>`;
 let out='';G.forEach(g=>{const ts=g[2].filter(canBase);if(!ts.length)return;const it=[];let ac=0;ts.forEach(t=>{if(isAc(t)){if(!ac){ac=1;it.push(['ac','📒 '+L('Kế toán','Accounting')])}}else it.push([t,TL[t]||NL[t]||t])});
  const lock=it.some(x=>x[0]=='set');out+=`<div class="tvg">${row('g:'+g[0],`<span class="tvh">${IC(g[0])}</span><b>${g[1]}</b>`,lock||it.some(x=>!h[x[0]]),lock)}<div class="tvs">${it.map(x=>row(x[0],x[1],x[0]=='set'||!h[x[0]],x[0]=='set')).join('')}</div></div>`});
 return '<div class="card"><h2>👁 '+L('Tab hiển thị','Visible tabs')+'</h2><div class="sub" style="margin-bottom:6px">'+L('Bật hoặc tắt từng tab trên thanh dưới và thanh tab. Chỉ áp dụng cho tài khoản này trên thiết bị này.','Show or hide each tab on the bottom bar and the tab bars. Applies to this account on this device only.')+'</div>'+out+'<div class="dgz"><div class="sub" style="margin-bottom:8px">'+L('Mặc định của cửa hàng dùng cho tài khoản hoặc thiết bị chưa tự chỉnh tab.','The store default is used by accounts or devices that haven’t customised tabs.')+(DB.tabDef?' '+L('Đã có mặc định.','A default is saved.'):'')+'</div><div class="row">'+(AU.role=='owner'?'<button class="s" onclick="tvDef()">💾 '+L('Lưu cấu hình này làm mặc định','Save as default')+'</button>':'')+'<button class="s" onclick="tvUse()">↺ '+L('Dùng mặc định','Use default')+'</button></div></div></div>'}
function tvDef(){if(!AU||AU.role!='owner')return;DB.tabDef={...hidMap()};save();toast(L('Đã lưu làm mặc định','Saved as default'))}
function tvUse(){const d={...(DB.tabDef||{})};for(const k in HID)delete HID[k];Object.assign(HID,d);try{lss(K+'_hid_'+AU.u,JSON.stringify(HID))}catch(e){}render();toast(L('Đã dùng mặc định','Default applied'))}
function tvTg(id,on){const h=hidMap();if(id.startsWith('g:')){const g=G.find(x=>x[0]==id.slice(2));if(!g)return;g[2].filter(canBase).forEach(t=>{if(t=='set')return;const k=isAc(t)?'ac':t;if(on)delete h[k];else h[k]=1})}else{if(id=='set')return;if(on)delete h[id];else h[id]=1}
 try{lss(K+'_hid_'+AU.u,JSON.stringify(h))}catch(e){}render()}
try{SGM.push('tab hien thi','visible tabs');SG[3][2].push('tab hien thi','visible tabs')}catch(e){}

const $app=document.getElementById('app'),$nav=document.getElementById('nav');$app.innerHTML='<div class="sub" style="padding:60px 0;text-align:center">Đang tải…</div>';init();
</script></body></html>
